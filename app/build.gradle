plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.google.services)
    alias(libs.plugins.navigation.safeargs)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kotlin.kapt)
}

android {
    namespace = 'com.vourourou.forklife'
    compileSdk 35

    defaultConfig {
        applicationId "com.vourourou.forklife"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 5
        versionName "1.1.0"

        testInstrumentationRunner "com.vourourou.forklife.HiltTestRunner"

        // OpenFoodFacts API configuration
        buildConfigField "String", "API_BASE_URL", '"https://world.openfoodfacts.org/"'
        buildConfigField "String", "API_USER_AGENT", '"ForkLife/1.0 (noreply@example.com)"'

        // Support for 16 KB page sizes
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = libs.versions.kotlinCompilerExtension.get()
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

dependencies {
    // Compose BOM for version alignment
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)

    // Core Compose
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation

    // Material 3
    implementation libs.compose.material3
    implementation libs.compose.material.icons

    // Activity & ViewModel Compose
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose

    // Navigation Compose
    implementation libs.navigation.compose

    // Hilt Compose
    implementation libs.hilt.navigation.compose

    // LiveData Compose (for observeAsState)
    implementation libs.compose.runtime.livedata

    // Coil for Compose (image loading)
    implementation libs.coil.compose

    // Accompanist for permissions
    implementation libs.accompanist.permissions

    // Lottie Compose (consolidated to single version)
    implementation libs.lottie.compose

    // Debug tooling for Compose
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    // Kotlin
    implementation libs.kotlin.stdlib

    // AndroidX Core
    implementation libs.core.ktx
    implementation libs.core.splashscreen
    implementation libs.appcompat
    implementation libs.datastore.preferences

    // Material
    implementation libs.material

    // Camera
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // ML Kit Barcode Scanning
    implementation libs.mlkit.barcode

    // Network
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // Hilt DI
    implementation libs.hilt.android
    kapt libs.hilt.android.compiler

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    // Google Play In-App Reviews
    implementation libs.play.review.ktx

    // Unit Testing
    testImplementation libs.junit

    // Android Testing
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core

    // Compose UI Testing
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.test.manifest

    // Hilt Testing
    androidTestImplementation libs.hilt.android.testing
    kaptAndroidTest libs.hilt.android.compiler

    // Coroutines Test
    androidTestImplementation libs.coroutines.test

    // MockK for mocking (exclude JUnit Jupiter to avoid duplicate META-INF files)
    androidTestImplementation(libs.mockk.android) {
        exclude group: 'org.junit.jupiter'
    }
}
